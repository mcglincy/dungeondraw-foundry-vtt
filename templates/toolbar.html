{{#*inline "toolPartial"}}
<div
  class="control ui-control control-tool toggle {{#if isActive}}active{{/if}}"
  title="{{localize title}}{{#if titleSuffix}} {{localize titleSuffix}}{{/if}}"
  data-tool="{{name}}"
  role="button"
>
  <i class="{{icon}}"></i>
</div>
{{/inline}}

<div
  id="dd-control-tools"
  class="faded-ui sub-controls app control-tools flexcol"
>
  <div class="dd-control-wrapper">
    <div class="addremove-toggle-row">
      <div
        class="control ui-control addremove-toggle {{toggleAddClass}}"
        data-addremove="add"
        role="button"
      >
        {{localize "DD.Add"}}
      </div>
      <div
        class="control ui-control addremove-toggle {{toggleRemoveClass}}"
        data-addremove="remove"
        role="button"
      >
        {{localize "DD.Remove"}}
      </div>
    </div>
    <div class="control-row-separator"></div>
    <div class="control-tool-row">
      {{#each row1}} {{> toolPartial}} {{/each}}
    </div>
    <div class="control-row-separator"></div>
    <div class="control-tool-row">
      {{#each row2}} {{> toolPartial}} {{/each}}
    </div>
    <div class="control-row-separator"></div>
    <div class="control-tool-row">
      {{#each row3}} {{> toolPartial}} {{/each}}
      <select name="themePainterThemeKey" data-dtype="string">
        {{selectOptions themeOptions selected=themePainterThemeKey
        valueAttr="value" labelAttr="name" }}
      </select>
    </div>
  </div>
</div>
